<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cartao">

        <!-- Cabeçalho: logo da instituição e nome do clube -->
        <div class="topo">
          <div class="id-escola">
            SNE <br>
            <span style="font-size: 10px; font-weight: normal;">Sociedade Nacional dos Estudantes</span>
          </div>
          <div class="label-clube">CLUBE DO<br><strong>ESTUDANTE</strong></div>
        </div>
    
        <!-- Corpo: foto do aluno + dados -->
        <div class="conteudo">
    
          <!-- Foto: coloque o arquivo foto.jpg na mesma pasta -->
          <img src="/img/OIP.webp" height="130px" width="100px" alt="Foto do estudante" />
    
          <!-- Lista de dados do aluno -->
          <div class="info-grid">
    
            <!-- Campo: Nome -->
            <div class="item">
              <span class="rotulo">Nome do Aluno</span>
              <span class="valor nome-destaque">MICAEL DAVID</span>
            </div>
    
            <!-- Campo: CPF -->
            <div class="item">
              <span class="rotulo">CPF</span>
              <span class="valor">000.000.000-00</span>
            </div>
    
            <!-- Campo: Instituição e Curso -->
            <div class="item">
              <span class="rotulo">Instituição / Curso</span>
              <span class="valor">UniFavip | Ciência da Computação</span>
            </div>
    
            <!-- Campo: Matrícula -->
            <div class="item">
              <span class="rotulo">Matrícula</span>
              <span class="valor">#2026-9988</span>
            </div>
    
          </div>
        </div>
    
        <!-- Rodapé: código de uso e ano de validade -->
        <div class="rodape">
          <div class="cod-uso">ID: 99-XYZ-2026</div>
          <div class="validade">2026</div>
        </div>
    
      </div>
</body>
</html>
